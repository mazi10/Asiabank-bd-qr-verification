<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Asia - Secure Verification Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Poppins', 'Hind Siliguri', sans-serif; 
            background: linear-gradient(135deg, #f0f4f9 0%, #e2e8f0 100%); 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            color: #1e293b; 
        }

        /* Top Branded Header Bar */
        .top-bank-bar {
            background: #ffffff;
            width: 100%;
            padding: 15px 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid #004c97;
        }
        .bank-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .bank-brand img {
            height: 40px;
            object-fit: contain;
        }
        .secure-badge-top {
            background: #e0f2fe;
            color: #0369a1;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #bae6fd;
        }

        /* Main Container - Boxless & Modern */
        .main-container {
            flex: 1;
            width: 100%;
            max-width: 650px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .portal-title-area {
            text-align: center;
            margin-bottom: 25px;
        }
        .portal-title-area h2 {
            font-size: 22px;
            color: #004c97;
            margin-bottom: 5px;
            font-weight: 700;
        }
        .portal-title-area p {
            font-size: 13.5px;
            color: #64748b;
            margin: 0;
        }

        /* Verification Success Banner */
        .success-banner {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 16px 20px;
            border-radius: 12px;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: 0.5px;
        }

        /* Modern Data Rows */
        .data-grid {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            padding: 10px 25px;
            border: 1px solid rgba(226, 232, 240, 0.8);
            margin-bottom: 25px;
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        .data-row:last-child {
            border-bottom: none;
        }
        .data-label {
            font-size: 13.5px;
            color: #64748b;
            font-weight: 500;
        }
        .data-value {
            font-size: 15.5px;
            color: #0f172a;
            font-weight: 700;
            text-align: right;
        }
        .data-value.highlight-amount {
            color: #004c97;
            font-size: 18px;
        }

        /* Error Box */
        .error-message { 
            text-align: center; 
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-top: 50px;
        }

        /* Modern Footer */
        .footer-section {
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            padding: 20px;
            text-align: center;
            margin-top: auto;
        }
        .page-links { 
            display: flex; 
            justify-content: center; 
            flex-wrap: wrap; 
            gap: 12px; 
            margin-bottom: 12px; 
            font-size: 12.5px; 
        }
        .page-links a { 
            color: #004c97; 
            text-decoration: none; 
            font-weight: 600; 
            transition: color 0.2s; 
        }
        .page-links a:hover { 
            color: #f58220; 
            text-decoration: underline; 
        }
        .page-links span {
            color: #cbd5e1;
        }
        .footer-note { 
            font-size: 11.5px; 
            color: #94a3b8; 
        }
    </style>
</head>
<body>

<!-- Top Navigation Bar with Logo -->
<div class="top-bank-bar">
    <div class="bank-brand">
        <!-- আপনার প্রজেক্ট ফোল্ডারে asia-logo.png নামে লোগো ফাইলটি নিশ্চিত করুন -->
        <img src="asia-logo.png" alt="Bank Asia P.L.C." onerror="this.style.display='none'">
        <span id="headerBox" style="font-weight: 700; font-size: 18px; color: #004c97;">BANK ASIA P.L.C.</span>
    </div>
    <div class="secure-badge-top">
        🔒 SSL Secured
    </div>
</div>

<!-- Main Section -->
<div class="main-container" id="mainCard">
    <div class="portal-title-area">
        <h2>Official QR Verification Portal</h2>
        <p>Real-time automated cryptographic account verification system</p>
    </div>

    <div class="success-banner">
        <span>✔</span> <span id="statusText">VERIFICATION SUCCESSFUL</span>
    </div>

    <div class="data-grid">
        <div class="data-row">
            <span class="data-label">Account Number</span>
            <span class="data-value" id="accountNo">---</span>
        </div>
        <div class="data-row">
            <span class="data-label">Account Holder Name</span>
            <span class="data-value" id="accountName">---</span>
        </div>
        <div class="data-row">
            <span class="data-label">Verified Balance / Amount</span>
            <span class="data-value highlight-amount" id="amount">---</span>
        </div>
        <div class="data-row">
            <span class="data-label">Report Generation Date</span>
            <span class="data-value" id="date">---</span>
        </div>
    </div>
</div>

<script src="data.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const uniqueId = urlParams.get('id');

    if (uniqueId && typeof bankData !== 'undefined' && bankData[uniqueId]) {
        const data = bankData[uniqueId];

        if(data.headerHtml) {
            document.getElementById('headerBox').innerHTML = data.headerHtml;
        }
        
        document.getElementById('accountNo').innerText = data.accountNo || '---';
        document.getElementById('accountName').innerText = data.name || '---';
        document.getElementById('amount').innerText = data.amount || '---';
        document.getElementById('date').innerText = data.date || '---';
        document.getElementById('statusText').innerText = data.statusText || 'VERIFICATION SUCCESSFUL';
    } else {
        document.getElementById('mainCard').innerHTML = `
            <div class="error-message">
                <h3 style="color: #ef4444; margin-bottom: 8px; font-size: 20px;">⚠️ তথ্য পাওয়া যায়নি!</h3>
                <p style="font-size: 14px; color: #64748b; margin: 0;">সঠিক কিউআর কোড স্ক্যান করুন অথবা লিঙ্কটি সঠিকভাবে যাচাই করুন।</p>
            </div>
        `;
    }
</script>

</body>
</html>
