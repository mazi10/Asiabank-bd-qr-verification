<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Admin Panel - Modern QR Generator</title>
    <!-- Quill Rich Text Editor CDN -->
    <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        body {
            font-family: 'Poppins', 'Hind Siliguri', sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 30px 20px;
            color: #1e293b;
        }
        .container {
            max-width: 750px;
            background: #ffffff;
            margin: 0 auto;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }
        h2 { 
            text-align: center; 
            color: #0f172a; 
            margin-bottom: 25px; 
            font-weight: 600;
            font-size: 24px;
            letter-spacing: -0.5px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: 500;
            margin-bottom: 7px;
            color: #475569;
            font-size: 13.5px;
        }
        input, select {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .row {
            display: flex;
            gap: 16px;
        }
        .row .form-group {
            flex: 1;
        }
        #editor-container {
            height: 130px;
            background: #f8fafc;
            border-radius: 8px;
            font-size: 15px;
        }
        .ql-container {
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }
        .ql-toolbar {
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            background: #f1f5f9;
        }
        .btn-primary {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            border: none;
            padding: 13px;
            width: 100%;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 15px;
            transition: opacity 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }
        .btn-primary:hover { opacity: 0.95; transform: translateY(-1px); }
        .btn-primary:active { transform: translateY(0); }
        
        .output-section {
            margin-top: 30px;
            padding: 25px;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            text-align: center;
        }
        .code-textarea {
            width: 100%;
            height: 110px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12.5px;
            padding: 10px;
            margin-top: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            resize: none;
            background: #ffffff;
            text-align: left;
        }
        #qrcode {
            display: flex;
            justify-content: center;
            margin: 15px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>প্রফেশনাল ব্যাংক এডমিন প্যানেল</h2>
    
    <form id="adminForm" onsubmit="generateQRCode(event)">
        
        <!-- পেজ সিলেকশন -->
        <div class="form-group" style="background: #eff6ff; padding: 14px; border-radius: 8px; border: 1px solid #bfdbfe;">
            <label style="color: #1d4ed8; font-weight: 600;">ভেরিফিকেশন পেজ ডিজাইন সিলেক্ট করুন:</label>
            <select id="selectedPage" class="form-control" required>
                <option value="page1.html">Page 1 (Design 1)</option>
                <option value="page2.html">Page 2 (Design 2)</option>
                <option value="page3.html" selected>Page 3 (Design 3 - Standard)</option>
                <option value="page4.html">Page 4 (Design 4)</option>
                <option value="page5.html">Page 5 (Design 5)</option>
            </select>
        </div>

        <!-- টেক্সট এডিটর -->
        <div class="form-group">
            <label>হেডিং টেক্সট (ব্যাঙ্কের নাম ও শাখা):</label>
            <div id="editor-container"></div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>ইউনিক আইডি (Unique ID / Tracking):</label>
                <input type="text" id="empId" value="1861570025384" required>
            </div>
            <div class="form-group">
                <label>ফন্ট স্টাইল (Font Family):</label>
                <select id="fontFamily">
                    <option value="'Hind Siliguri', sans-serif">Hind Siliguri (বাংলা)</option>
                    <option value="Arial, sans-serif">Arial</option>
                    <option value="'Times New Roman', serif">Times New Roman</option>
                    <option value="'Poppins', sans-serif">Poppins</option>
                </select>
            </div>
        </div>

        <hr style="margin: 20px 0; border:0; border-top:1px solid #e2e8f0;">

        <!-- মূল ৫টি জিনিস / ফিল্ড -->
        <div class="row">
            <div class="form-group">
                <label>১. অ্যাকাউন্ট নং (Account No):</label>
                <input type="text" id="accountNo" value="1282112000002446" required>
            </div>
            <div class="form-group">
                <label>২. অ্যাকাউন্ট নাম (Account Name):</label>
                <input type="text" id="accountName" value="AHAMMAD MAZI" required>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>৩. পরিমাণ / ব্যালেন্স (Amount):</label>
                <input type="text" id="amount" value="5,118,827.42" required>
            </div>
            <div class="form-group">
                <label>৪. রিপোর্ট জেনারেশন তারিখ (Date):</label>
                <input type="text" id="date" value="18-Sep-2026" required>
            </div>
        </div>

        <div class="form-group">
            <label>৫. স্ট্যাটাস টেক্সট (Status Text):</label>
            <input type="text" id="statusText" value="Verification success!!!" required>
        </div>

        <button type="submit" class="btn-primary">জেনারেট কিউআর কোড ও ডাটা কোড</button>
    </form>

    <!-- আউটপুট সেকশন -->
    <div class="output-section" id="outputSection" style="display: none;">
        <h3 style="margin-top:0; font-size: 18px; color: #0f172a;">কিউআর কোড প্রিভিউ</h3>
        <div id="qrcode"></div>
        
        <div style="margin: 15px 0;">
            <button onclick="downloadQRCode('png')" style="background: #2563eb; color: white; border: none; padding: 9px 14px; border-radius: 6px; cursor: pointer; font-weight: 500; margin-right: 5px;">Download PNG</button>
            <button onclick="downloadQRCode('jpg')" style="background: #16a34a; color: white; border: none; padding: 9px 14px; border-radius: 6px; cursor: pointer; font-weight: 500;">Download JPG</button>
        </div>
        <p id="qrTextLink" style="font-size: 12.5px; color: #64748b; word-break: break-all;"></p>

        <hr style="margin: 20px 0; border:0; border-top:1px solid #cbd5e1;">

        <div class="form-group" style="text-align: left;">
            <label>data.js এ বসানোর কোড:</label>
            <textarea id="codeOutput" class="code-textarea" readonly></textarea>
        </div>
        <button type="button" onclick="copyCode()" style="background: #0f172a; color: #fff; padding: 10px; border-radius: 6px; border: none; cursor: pointer; font-weight: 500; width: 100%;">কোড কপি করুন</button>
    </div>
</div>

<!-- Quill Script -->
<script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
<script>
    const quill = new Quill('#editor-container', {
        modules: {
            toolbar: [
                ['bold', 'italic', 'underline'],
                [{ 'color': [] }, { 'background': [] }],
                ['clean']
            ]
        },
        theme: 'snow'
    });

    quill.root.innerHTML = 'Ucb Bank PLC<br>Munshiganj Branch, Dhaka';

    function generateQRCode(event) {
        event.preventDefault();

        const selectedPage = document.getElementById('selectedPage').value;
        const id = document.getElementById('empId').value.trim();
        const headerHtml = quill.root.innerHTML;
        const fontFamily = document.getElementById('fontFamily').value;
        const accountNo = document.getElementById('accountNo').value;
        const accountName = document.getElementById('accountName').value;
        const amount = document.getElementById('amount').value;
        const date = document.getElementById('date').value;
        const statusText = document.getElementById('statusText').value;

        const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
        const targetUrl = `${baseUrl}${selectedPage}?id=${id}`;

        document.getElementById('qrTextLink').innerText = "লিংক: " + targetUrl;

        const qrContainer = document.getElementById('qrcode');
        qrContainer.innerHTML = "";
        const canvas = document.createElement('canvas');
        qrContainer.appendChild(canvas);

        new QRious({
            element: canvas,
            value: targetUrl,
            size: 180,
            background: 'white',
            foreground: 'black'
        });

        const escapedHeader = headerHtml.replace(/`/g, '\\`');
        const jsCode = `    "${id}": {
        headerHtml: \`${escapedHeader}\`,
        fontFamily: "${fontFamily}",
        accountNo: "${accountNo}",
        name: "${accountName}",
        amount: "${amount}",
        date: "${date}",
        statusText: "${statusText}"
    },`;

        document.getElementById('codeOutput').value = jsCode;
        document.getElementById('outputSection').style.display = 'block';
    }

    function copyCode() {
        const codeBox = document.getElementById('codeOutput');
        codeBox.select();
        codeBox.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(codeBox.value).then(() => {
            alert('কোড সফলভাবে কপি হয়েছে!');
        });
    }

    function downloadQRCode(format) {
        const qrImage = document.querySelector("#qrcode img") || document.querySelector("#qrcode canvas");
        if (!qrImage) {
            alert("প্রথমে কিউআর কোড জেনারেট করুন!");
            return;
        }

        let imageUrl = qrImage.tagName === "IMG" ? qrImage.src : qrImage.toDataURL("image/png");
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        const img = new Image();
        
        img.crossOrigin = "anonymous";
        img.src = imageUrl;
        
        img.onload = function() {
            canvas.width = img.width * 4;
            canvas.height = img.height * 4;
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            let mimeType = format === 'jpg' ? 'image/jpeg' : 'image/png';
            const link = document.createElement('a');
            link.download = `QR-Code-HighRes.${format}`;
            link.href = canvas.toDataURL(mimeType, 1.0);
            link.click();
        };
    }
</script>

</body>
</html>
