<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Asia - Secure Verification Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', 'Hind Siliguri', sans-serif; background: #f0f4f8; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #1e293b; }
        .verification-card { background: #ffffff; width: 100%; max-width: 500px; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08); border: 1px solid #e2e8f0; position: relative; overflow: hidden; }
        .verification-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, #004c97, #f58220); }
        .header-section { text-align: center; margin-bottom: 20px; border-bottom: 1px solid #f1f5f9; padding-bottom: 15px; }
        .status-badge { display: flex; align-items: center; justify-content: center; gap: 8px; background: #dcfce7; color: #166534; padding: 8px 16px; border-radius: 30px; font-size: 13.5px; font-weight: 600; margin-bottom: 22px; border: 1px solid #bbf7d0; }
        .info-card { background: #f8fafc; border: 1px solid #e2e8f0; border-left: 4px solid #004c97; border-radius: 10px; padding: 12px 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .info-label { font-size: 13px; color: #64748b; font-weight: 500; }
        .info-value { font-size: 14.5px; color: #0f172a; font-weight: 600; text-align: right; }
        .error-message { text-align: center; color: #dc2626; font-weight: 600; padding: 20px; }
        
        .page-links { display: flex; justify-content: center; gap: 15px; margin-top: 18px; font-size: 13px; }
        .page-links a { color: #004c97; text-decoration: none; font-weight: 600; transition: color 0.2s; }
        .page-links a:hover { text-decoration: underline; color: #f58220; }

        .footer-note { text-align: center; font-size: 11.5px; color: #94a3b8; margin-top: 15px; border-top: 1px solid #f1f5f9; padding-top: 12px; }
    </style>
</head>
<body>

<div class="verification-card" id="mainCard">
    <div class="header-section" id="headerBox"></div>

    <div class="status-badge">
        <span>✔</span> <span id="statusText">Verification success</span>
    </div>

    <div class="info-card" style="border-left-color: #004c97;">
        <span class="info-label">Account No</span>
        <span class="info-value" id="accountNo">---</span>
    </div>

    <div class="info-card" style="border-left-color: #0ea5e9;">
        <span class="info-label">Account Name</span>
        <span class="info-value" id="accountName">---</span>
    </div>

    <div class="info-card" style="border-left-color: #16a34a;">
        <span class="info-label">Report Date Balance / Amount</span>
        <span class="info-value" id="amount">---</span>
    </div>

    <div class="info-card" style="border-left-color: #f58220;">
        <span class="info-label">Report Generation Date</span>
        <span class="info-value" id="date">---</span>
    </div>

    <div class="page-links">
        <a href="about.html" target="_blank">About Bank Asia</a>
        <span>&bull;</span>
        <a href="contact.html" target="_blank">Contact Support</a>
    </div>

    <div class="footer-note">Bank Asia P.L.C. Official Secured Verification Portal &bull; Authorized QR System</div>
</div>

<script src="data.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const uniqueId = urlParams.get('id');

    if (uniqueId && typeof bankData !== 'undefined' && bankData[uniqueId]) {
        const data = bankData[uniqueId];

        const headerBox = document.getElementById('headerBox');
        headerBox.innerHTML = data.headerHtml;
        headerBox.style.fontFamily = data.fontFamily || "'Poppins', sans-serif";

        document.getElementById('accountNo').innerText = data.accountNo || '---';
        document.getElementById('accountName').innerText = data.name || '---';
        document.getElementById('amount').innerText = data.amount || '---';
        document.getElementById('date').innerText = data.date || '---';
        document.getElementById('statusText').innerText = data.statusText || 'Verification success';
    } else {
        document.getElementById('mainCard').innerHTML = `
            <div class="error-message">
                <h3 style="color: #ef4444; margin-bottom: 8px;">⚠️ তথ্য পাওয়া যায়নি!</h3>
                <p style="font-size: 13px; color: #64748b; font-weight: 400; margin: 0;">সঠিক কিউআর কোড স্ক্যান করুন অথবা লিঙ্কটি যাচাই করুন।</p>
            </div>
        `;
    }
</script>

</body>
</html>
